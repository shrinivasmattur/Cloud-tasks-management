name: Deploy Task Management App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-task-backend:${{ github.sha }} \
            ./server

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-task-frontend:${{ github.sha }} \
            ./client

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-task-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/cloud-task-frontend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cloud_task_management

            aws ecr get-login-password --region ap-south-1 | \
            docker login --username AWS --password-stdin \
            107001693401.dkr.ecr.ap-south-1.amazonaws.com

            docker pull 107001693401.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-backend:${{ github.sha }}
            docker pull 107001693401.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-frontend:${{ github.sha }}

            docker tag 107001693401.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-backend:${{ github.sha }} \
            107001693401.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-backend:v1

            docker tag 107001693401.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-frontend:${{ github.sha }} \
            107001693401.dkr.ecr.ap-south-1.amazonaws.com/cloud-task-frontend:v1

            docker compose down
            docker compose up -d